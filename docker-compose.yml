# Local development only — not used for Railway deploy.
# Railway: create three services — Postgres (db), api (backend/), web (frontend/).

services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8080
      HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:8080"
    depends_on:
      - api
    restart: unless-stopped
