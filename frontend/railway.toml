# Frontend service — Railway Root Directory: frontend

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "tailwind.config.js", "postcss.config.js", "nginx.conf"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
